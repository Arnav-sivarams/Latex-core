<!doctype html><meta charset="utf-8"><title>LaTeX Core</title><style>body{font:16px system-ui;max-width:1000px;margin:2rem auto}input,button,textarea{font:inherit;margin:.2rem}textarea{width:100%;height:28rem}#files button{display:block;width:100%;text-align:left}pre{white-space:pre-wrap;background:#eee;padding:1rem}</style><h1>LaTeX Core</h1><section id="auth"><input id="email" placeholder="email"><input id="password" type="password" placeholder="password (12+ chars)"><button onclick="auth('register')">Register</button><button onclick="auth('login')">Login</button></section><section id="projects" hidden><p><span id="who"></span> <button onclick="logout()">Logout</button></p><input id="projectName" placeholder="Project name"><button onclick="createProject()">Create project</button><div id="projectList"></div></section><section id="editor" hidden><h2 id="title"></h2><aside id="files"></aside><p><button onclick="save()">Save</button><button onclick="makeMain()">Make main</button><button onclick="compile()">Compile</button> <span id="status"></span></p><textarea id="text"></textarea><pre id="log"></pre><a id="pdf" target="_blank"></a></section><script>let project,file,version;const q=s=>document.querySelector(s);async function api(u,o={}){let r=await fetch(u,o);if(!r.ok)throw Error((await r.json().catch(()=>({error:r.statusText}))).error);return r}async function auth(kind){try{let r=await api('/api/auth/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:q('#email').value,password:q('#password').value})});q('#who').textContent=(await r.json()).email;q('#auth').hidden=true;q('#projects').hidden=false;list()}catch(e){alert(e.message)}}async function logout(){await api('/api/auth/logout',{method:'POST'});location.reload()}async function list(){let ps=await (await api('/api/projects')).json();q('#projectList').innerHTML='';ps.forEach(p=>{let b=document.createElement('button');b.textContent=p.name;b.onclick=()=>open(p.id);q('#projectList').append(b)})}async function createProject(){let p=await (await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:q('#projectName').value})})).json();open(p.id);list()}async function open(id){project=await (await api('/api/projects/'+id)).json();version=project.version;q('#editor').hidden=false;q('#title').textContent=project.name;let box=q('#files');box.innerHTML='';project.files.forEach(f=>{let b=document.createElement('button');b.textContent=f.path+(f.path===project.main_file?' ★':'');b.onclick=()=>load(f.path);box.append(b)});if(project.main_file)load(project.main_file)}async function load(path){file=path;let r=await api('/api/projects/'+project.id+'/files/'+encodeURI(path));q('#text').value=await r.text();version=Number(r.headers.get('etag').replaceAll('"',''))}async function save(){try{let r=await api('/api/projects/'+project.id+'/files/'+encodeURI(file),{method:'PUT',headers:{'If-Match':'"'+version+'"'},body:q('#text').value});version=(await r.json()).version;await open(project.id)}catch(e){alert(e.message)}}async function makeMain(){let r=await api('/api/projects/'+project.id+'/main',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:file,version})});version=(await r.json()).version;open(project.id)}async function compile(){let j=await (await api('/api/projects/'+project.id+'/compile',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json();poll(j.id)}async function poll(id){let j=await (await api('/api/jobs/'+id)).json();q('#status').textContent=j.state;if(['queued','running','claimed'].includes(j.state))return setTimeout(()=>poll(id),1000);let as=await (await api('/api/jobs/'+id+'/artifacts')).json();for(let a of as){let u='/api/jobs/'+id+'/artifacts/'+a.id;if(a.name.endsWith('.pdf')){q('#pdf').href=u;q('#pdf').textContent='Open PDF'}if(a.name.endsWith('.log'))q('#log').textContent=await (await api(u)).text()}}(async()=>{try{let m=await (await api('/api/auth/me')).json();q('#who').textContent=m.email;q('#auth').hidden=true;q('#projects').hidden=false;list()}catch(_){}})()</script>
