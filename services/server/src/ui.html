<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LaTeX-Core</title><style>
:root{color-scheme:light;font:14px system-ui;color:#1d2733;background:#edf1f5}*{box-sizing:border-box}body{margin:0;height:100vh}.hidden{display:none!important}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:5px;padding:.55rem .8rem;background:#e1e7ee;color:#172230}button.primary{background:#1769aa;color:white}button:disabled{opacity:.55;cursor:not-allowed}input{padding:.55rem;border:1px solid #b9c5d1;border-radius:5px}#login{height:100%;display:grid;place-items:center}.card{width:min(380px,92vw);padding:2rem;background:white;border-radius:9px;box-shadow:0 12px 34px #2334}.card input{width:100%;margin:.35rem 0}.error{color:#a11;min-height:1.3em}.app{height:100%;display:grid;grid-template-rows:52px 1fr}.top{display:flex;gap:.7rem;align-items:center;padding:.55rem .9rem;background:#172b3a;color:white}.top strong{font-size:17px}.top .spacer{flex:1}.top button{background:#315268;color:white}.top button.primary{background:#2782c4}.layout{min-height:0;display:grid;grid-template-columns:240px minmax(360px,1fr) minmax(330px,38%)}.side,.preview{background:#fff;border-right:1px solid #ccd6df;min-height:0;overflow:auto;padding:.8rem}.preview{border-right:0;border-left:1px solid #ccd6df;display:flex;flex-direction:column;gap:.7rem}.side h3{margin:.4rem 0}.list button{width:100%;text-align:left;margin:.15rem 0;background:transparent}.list button.active{background:#d9ecfa}.main{min-width:0;display:grid;grid-template-rows:1fr 180px;background:#f8fafb}.editor{min-height:0;padding:.9rem;display:flex;flex-direction:column;gap:.6rem}.editor-head{display:flex;gap:.6rem;align-items:center}.editor-head .spacer{flex:1}textarea{width:100%;height:100%;resize:none;border:1px solid #b7c4d0;border-radius:6px;padding:1rem;background:#202a33;color:#eef5fa;font:14px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.panel{border-top:1px solid #cdd7e0;padding:.7rem;overflow:auto;background:#fff}.panel pre{white-space:pre-wrap;margin:.5rem 0;font:12px/1.4 ui-monospace,monospace}.preview iframe{width:100%;flex:1;border:1px solid #c7d2dc;border-radius:5px}.placeholder{display:grid;place-items:center;flex:1;color:#667788;border:1px dashed #b8c5d1;border-radius:5px}.muted{color:#667788;font-size:12px}@media(max-width:900px){.layout{grid-template-columns:200px 1fr}.preview{display:none}}@media(max-width:620px){.layout{grid-template-columns:1fr}.side{display:none}.top .project-name{display:none}}
</style><section id="login"><form class="card" onsubmit="login(event)"><h1>LaTeX-Core</h1><p class="muted">Sign in with credentials supplied by your server owner.</p><input id="email" type="email" required placeholder="Email"><input id="password" type="password" required placeholder="Password"><p id="loginError" class="error"></p><button class="primary" type="submit">Log in</button></form></section><section id="app" class="app hidden"><header class="top"><strong>LaTeX-Core</strong><span id="projectName" class="project-name">No project open</span><span id="saveState" class="muted">Saved</span><span class="spacer"></span><span id="compileState">Ready</span><button id="compileButton" class="primary" onclick="compileProject()">Compile</button><span id="who"></span><button onclick="logout()">Log out</button></header><div class="layout"><aside class="side"><h3>Projects</h3><div id="projects" class="list"></div><input id="newProjectName" placeholder="New project name"><button class="primary" onclick="createProject()">Create project</button><hr><h3>Files</h3><div id="files" class="list"></div><button onclick="newFile()">New file</button></aside><main class="main"><section class="editor"><div class="editor-head"><strong id="fileName">Choose a file</strong><span id="mainMark" class="muted"></span><span class="spacer"></span><button onclick="setMain()">Set as main</button><button id="saveButton" class="primary" onclick="save()">Save</button></div><textarea id="editor" disabled spellcheck="false" placeholder="Open or create a project to start editing."></textarea></section><section class="panel"><strong>Compile output</strong><span id="jobInfo" class="muted"></span><pre id="output">No compile submitted.</pre></section></main><aside class="preview"><div><strong>PDF preview</strong> <a id="download" class="hidden" download="document.pdf">Download PDF</a></div><iframe id="pdf" class="hidden" title="Compiled PDF"></iframe><div id="pdfPlaceholder" class="placeholder">Compile a project to preview its PDF.</div></aside></div></section><script>
let currentProject=null,currentFile=null,version=0,dirty=false,jobActive=false;const $=s=>document.querySelector(s);function message(v,bad=false){$('#loginError').textContent=v;$('#loginError').className=bad?'error':'muted'}async function request(url,opt={}){try{let r=await fetch(url,opt);if(r.status===401){showLogin();throw Error('Your session has ended.')}if(!r.ok){let x=await r.json().catch(()=>({error:r.statusText}));throw Error(x.error||r.statusText)}return r}catch(e){if(!e.message.includes('session has ended'))setStatus(e.message,true);throw e}}function setStatus(v,bad=false){$('#output').textContent=v;$('#output').style.color=bad?'#a11':''}function showLogin(){$('#app').classList.add('hidden');$('#login').classList.remove('hidden');currentProject=null;currentFile=null}async function login(e){e.preventDefault();message('');try{let r=await request('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});let u=await r.json();$('#who').textContent=u.email;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await listProjects()}catch(x){message(x.message,true)}}async function logout(){try{await request('/api/auth/logout',{method:'POST'})}catch(_){}showLogin()}async function listProjects(){let ps=await (await request('/api/projects')).json();let box=$('#projects');box.innerHTML='';ps.forEach(p=>{let b=document.createElement('button');b.textContent=p.name;b.className=currentProject&&p.id===currentProject.id?'active':'';b.onclick=()=>openProject(p.id);box.append(b)})}async function createProject(){let name=$('#newProjectName').value.trim();if(!name)return;try{let p=await (await request('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})})).json();$('#newProjectName').value='';await openProject(p.id);await listProjects()}catch(e){setStatus(e.message,true)}}async function openProject(id){if(dirty&&!confirm('Discard unsaved changes?'))return;try{currentProject=await (await request('/api/projects/'+id)).json();$('#projectName').textContent=currentProject.name;$('#files').innerHTML='';currentProject.files.forEach(f=>addFileButton(f.path));let initial=currentProject.main_file||currentProject.files[0]?.path;if(initial)await loadFile(initial);else clearEditor();await listProjects()}catch(e){setStatus(e.message,true)}}function addFileButton(path){let b=document.createElement('button');b.textContent=path+(currentProject.main_file===path?'  ★':'');b.className=path===currentFile?'active':'';b.onclick=()=>loadFile(path);$('#files').append(b)}async function loadFile(path){if(dirty&&!confirm('Discard unsaved changes?'))return;try{let r=await request('/api/projects/'+currentProject.id+'/files/'+encodeURI(path));currentFile=path;$('#editor').value=await r.text();version=Number(r.headers.get('etag').replaceAll('"',''));$('#editor').disabled=false;$('#fileName').textContent=path;$('#mainMark').textContent=currentProject.main_file===path?'Main file':' ';dirty=false;renderDirty();currentProject.files.forEach(_=>{});await openProjectButtons()}catch(e){setStatus(e.message,true)}}async function openProjectButtons(){let fs=$('#files');fs.innerHTML='';currentProject.files.forEach(f=>addFileButton(f.path))}function clearEditor(){currentFile=null;$('#editor').value='';$('#editor').disabled=true;$('#fileName').textContent='Choose a file';dirty=false;renderDirty()}function renderDirty(){$('#saveState').textContent=dirty?'Unsaved changes':'Saved';$('#saveButton').disabled=!dirty}$('#editor').addEventListener('input',()=>{dirty=true;renderDirty()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}});async function save(){if(!currentFile||!dirty)return;try{let r=await request('/api/projects/'+currentProject.id+'/files/'+encodeURI(currentFile),{method:'PUT',headers:{'If-Match':'"'+version+'"'},body:$('#editor').value});version=(await r.json()).version;dirty=false;renderDirty();await openProject(currentProject.id)}catch(e){setStatus(e.message+(e.message.includes('conflict')?' Reload the file before saving.':''),true)}}async function newFile(){if(!currentProject)return;let path=prompt('New file path (for example chapter.tex):');if(!path)return;try{let r=await request('/api/projects/'+currentProject.id+'/files/'+encodeURI(path),{method:'PUT',headers:{'If-Match':'"'+currentProject.version+'"'},body:''});version=(await r.json()).version;await openProject(currentProject.id);await loadFile(path)}catch(e){setStatus(e.message,true)}}async function setMain(){if(!currentFile)return;try{let r=await request('/api/projects/'+currentProject.id+'/main',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:currentFile,version})});version=(await r.json()).version;await openProject(currentProject.id)}catch(e){setStatus(e.message,true)}}async function compileProject(){if(!currentProject||jobActive)return;if(dirty){setStatus('Save changes before compiling.',true);return}jobActive=true;$('#compileButton').disabled=true;try{let j=await (await request('/api/projects/'+currentProject.id+'/compile',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json();poll(j.id)}catch(e){jobActive=false;$('#compileButton').disabled=false}}async function poll(id){try{let j=await (await request('/api/jobs/'+id)).json();$('#compileState').textContent=j.state;$('#jobInfo').textContent=' Job '+id;if(['queued','claimed','running'].includes(j.state)){setStatus('Compilation '+j.state+'…');return setTimeout(()=>poll(id),900)}jobActive=false;$('#compileButton').disabled=false;if(j.state!=='succeeded'){setStatus(j.error?JSON.stringify(j.error,null,2):'Compilation '+j.state,true);return}let as=await (await request('/api/jobs/'+id+'/artifacts')).json();let log=as.find(a=>a.name.endsWith('.log')),pdf=as.find(a=>a.name.endsWith('.pdf'));if(log)setStatus(await (await request('/api/jobs/'+id+'/artifacts/'+log.id)).text());if(pdf){let url='/api/jobs/'+id+'/artifacts/'+pdf.id;$('#pdf').src=url;$('#pdf').classList.remove('hidden');$('#pdfPlaceholder').classList.add('hidden');$('#download').href=url;$('#download').classList.remove('hidden')}}catch(e){jobActive=false;$('#compileButton').disabled=false}}(async()=>{try{let u=await (await request('/api/auth/me')).json();$('#who').textContent=u.email;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');listProjects()}catch(_){}})();
</script>
