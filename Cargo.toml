[workspace]
members = [
    "crates/artifact-store",
    "crates/blob-store",
    "crates/compiler",
    "crates/core-types",
    "crates/extension-api",
    "crates/extension-host",
    "crates/parser",
    "crates/persistence",
    "crates/queue",
    "crates/sandbox",
    "crates/tex-index",
    "crates/workspace",
    "services/cli",
    "services/server",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
artifact-store = { path = "crates/artifact-store" }
blob-store = { path = "crates/blob-store" }
bytes = "1"
calamine = "0.26"
compiler = { path = "crates/compiler" }
core-types = { path = "crates/core-types" }
csv = "1.3"
extension-api = { path = "crates/extension-api" }
extension-host = { path = "crates/extension-host" }
latex-parser = { path = "crates/parser" }
persistence = { path = "crates/persistence" }
queue = { path = "crates/queue" }
sandbox = { path = "crates/sandbox" }
tex-index = { path = "crates/tex-index" }
workspace-model = { path = "crates/workspace" }
hex = "0.4"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "migrate", "macros"] }
thiserror = "2"
tree-sitter = "=0.24.1"
tree-sitter-bibtex = { path = "crates/parser/vendor/tree-sitter-bibtex" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "fs"] }
uuid = { version = "1", features = ["serde", "v4"] }
argon2 = "0.5"
axum = { version = "0.8", features = ["json", "macros", "multipart", "ws"] }
futures-util = "0.3"
flate2 = "1"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["limit", "set-header", "trace"] }
tower = { version = "0.5", features = ["util"] }
zip = { version = "7.3.0-pre1", default-features = false, features = ["deflate"] }
yrs = "0.27.4"
zstd = "0.13"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
